<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no retiré : pénalité Lighthouse accessibilité -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO -->
    <title>VIT AUTO — Location & Vente de Véhicules en Afrique</title>
    <meta name="description" content="Louez, achetez ou vendez des véhicules en Afrique de l'Ouest. Catalogue de véhicules, chauffeurs privés, service client 24h/24." />
    <meta name="keywords" content="location voiture, vente voiture, chauffeur privé, Dakar, Abidjan, Bamako, VIT AUTO" />
    <meta name="author" content="VIT AUTO" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://vit-auto.com" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="VIT AUTO — Location & Vente de Véhicules" />
    <meta property="og:description" content="Louez ou achetez votre véhicule en Afrique de l'Ouest" />
    <meta property="og:image"       content="https://vit-auto.com/icons/icon-512x512.png" />
    <meta property="og:url"         content="https://vit-auto.com" />
    <meta property="og:site_name"   content="VIT AUTO" />
    <meta property="og:locale"      content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="VIT AUTO — Location & Vente de Véhicules" />
    <meta name="twitter:description" content="Louez ou achetez votre véhicule en Afrique de l'Ouest" />
    <meta name="twitter:image"       content="https://vit-auto.com/icons/icon-512x512.png" />

    <!-- Mobile / PWA -->
    <meta name="theme-color" content="#162040" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VIT AUTO" />

    <!-- Icônes -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Resource hints : connexions anticipées -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://ideal-learning-production-3c89.up.railway.app" />

    <!-- Preload image LCP (première slide hero — format WebP) -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=1200&q=80&auto=format&fit=crop&fm=webp"
      fetchpriority="high"
    />

    <!-- Google Fonts — NON-BLOQUANT (technique media=print) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
    </noscript>

    <!-- CSS critique inline pour éviter le FOUT avant chargement Poppins -->
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; }
    </style>

    <!-- Structured Data JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "AutoDealer",
      "name": "VIT AUTO",
      "description": "Plateforme de location et vente de véhicules en Afrique de l'Ouest — 14 pays couverts",
      "url": "https://vit-auto.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://vit-auto.com/favicon.svg"
      },
      "areaServed": [
        "Côte d'Ivoire","Sénégal","Mali","Maroc",
        "Niger","Burkina Faso","Guinée","Cameroun",
        "Togo","Bénin","Ghana","Mauritanie","Tunisie","Algérie"
      ],
      "serviceType": ["Car Rental","Car Sales","Private Driver"],
      "priceRange": "$$",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": ["French","English","Arabic"]
      },
      "sameAs": ["https://vitauto.vercel.app"]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
