<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no retiré : pénalité Lighthouse accessibilité -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO -->
    <title>VIT AUTO — Location, vente et import de véhicules à l'international</title>
    <meta name="description" content="Louez, achetez, importez ou exportez un véhicule dans 28 pays. Inspection, transport, dédouanement et livraison gérés de bout en bout, avec paiement sécurisé." />
    <meta name="keywords" content="location voiture, vente voiture, import véhicule, export véhicule, chauffeur privé, Casablanca, Abidjan, Dakar, VIT AUTO" />
    <meta name="author" content="VIT AUTO" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://vit-auto.com" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="VIT AUTO — Location, vente et import de véhicules à l'international" />
    <meta property="og:description" content="Location, vente et import de véhicules entre l'Afrique, l'Europe, l'Asie et le Moyen-Orient." />
    <meta property="og:image"       content="https://vit-auto.com/icons/icon-512x512.png" />
    <meta property="og:url"         content="https://vit-auto.com" />
    <meta property="og:site_name"   content="VIT AUTO" />
    <meta property="og:locale"      content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="VIT AUTO — Location, vente et import de véhicules à l'international" />
    <meta name="twitter:description" content="Location, vente et import de véhicules entre l'Afrique, l'Europe, l'Asie et le Moyen-Orient." />
    <meta name="twitter:image"       content="https://vit-auto.com/icons/icon-512x512.png" />

    <!-- Mobile / PWA -->
    <meta name="theme-color" content="#162040" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VIT AUTO" />

    <!-- Icônes -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Resource hints : connexions anticipées -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://vit-auto-api.onrender.com" />

    <!-- Preload image LCP (première slide hero — format WebP) -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=1200&q=80&auto=format&fit=crop&fm=webp"
      fetchpriority="high"
    />

    <!-- Google Fonts — NON-BLOQUANT (technique media=print) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    />
    <!-- Chargée normalement, et non par l'astuce `media="print"` +
         `onload="this.media='all'"` : la CSP de production interdit les
         gestionnaires en ligne (`script-src` sans `unsafe-inline`), donc ce
         `onload` ne s'exécutait JAMAIS en ligne. La feuille restait en
         `media="print"`, Poppins n'était jamais appliquée à l'écran et tout
         le site s'affichait dans la police de secours du système.
         Mesuré : `document.fonts` vide en production, `Poppins` en local (où
         aucune CSP ne s'applique) — d'où un défaut invisible en local.
         Le `rel="preload" as="style"` ci-dessus lance déjà le téléchargement :
         le lien normal ne fait qu'appliquer une feuille déjà en vol. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    />

    <!-- CSS critique inline pour éviter le FOUT avant chargement Poppins -->
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; }
    </style>

    <!-- Structured Data JSON-LD -->
    <!-- Données structurées. Elles décrivaient VIT AUTO comme une plateforme
         « en Afrique de l'Ouest — 14 pays couverts », alors que le siège est à
         Casablanca, que 28 pays sont configurés et que l'offre relie l'Asie,
         le Golfe et l'Europe. `sameAs` pointait en outre vers une URL de
         PRÉVERSION Vercel, donnée aux moteurs comme profil officiel.
         Ce bloc statique est celui que les robots lisent sans exécuter le
         JavaScript : c'est donc lui qui fait foi pour l'accueil. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "AutoDealer",
      "name": "VIT AUTO",
      "description": "Location, vente, import et export de véhicules à l'international — inspection, transport, dédouanement et livraison gérés de bout en bout.",
      "url": "https://vit-auto.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://vit-auto.com/favicon.svg"
      },
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Boulevard Lalla Yacout & Rue El Arrar, Résidence Galis",
        "addressLocality": "Casablanca",
        "addressCountry": "MA"
      },
      "email": "contact@vit-auto.com",
      "telephone": "+212607742672",
      "areaServed": [
        "Maroc","Côte d'Ivoire","Sénégal","Mali","Niger","Burkina Faso",
        "Guinée","Cameroun","Togo","Bénin","Ghana","Mauritanie",
        "Tunisie","Algérie","Nigeria","France","Belgique","Espagne",
        "Émirats Arabes Unis","Chine","Japon","Canada","Royaume-Uni","Suisse"
      ],
      "serviceType": ["Car Rental","Car Sales","Vehicle Import","Vehicle Export","Private Driver"],
      "priceRange": "$$",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "telephone": "+212607742672",
        "email": "contact@vit-auto.com",
        "availableLanguage": ["French","English","Arabic"]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- L'enregistrement du service worker vivait ici, en script INLINE. La
         Content-Security-Policy posée sur vercel.json (script-src 'self', sans
         'unsafe-inline') le bloquait silencieusement : plus aucun nouveau
         visiteur n'installait le service worker, et la PWA cessait de
         fonctionner sans la moindre erreur visible. Déplacé dans main.jsx, qui
         est un module servi depuis l'origine — donc autorisé. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
