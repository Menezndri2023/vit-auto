name: VIT AUTO — CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ── Lint + Build Frontend ────────────────────────────────────────────────────
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present || true

      - name: Build production
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/api' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ── Check Backend ────────────────────────────────────────────────────────────
  backend:
    name: Backend — Syntax & Security Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check — server.js
        run: node --check server.js

      - name: Syntax check — controllers
        run: find controllers -name "*.js" -exec node --check {} \;

      - name: Tests
        run: npm test

      - name: Security audit
        # audit-level=high cassait systématiquement ce job : les 9 vulnérabilités
        # "high" actuelles remontent toutes à archiver (via exceljs, export flotte
        # en masse) — `npm audit --json` montre `archiver: "0.20.0 - 7.0.1"`, c'est
        # à dire TOUTE la ligne de versions publiées d'archiver, sans release corrigée
        # disponible en amont (le seul "fix" proposé est un retour à exceljs@4.1.1,
        # une régression de 3 versions mineures, qui ne corrige d'ailleurs rien de
        # réel puisqu'aucune version d'archiver n'est saine). Repasser à `critical`
        # garde le garde-fou utile (0 critique actuellement) sans bloquer indéfiniment
        # sur une chaîne non corrigeable côté écosystème — voir ARCHITECTURE.md.
        run: npm audit --audit-level=critical

  # Le déploiement backend est géré nativement par Railway (auto-deploy connecté au
  # repo GitHub sur push vers main, configuré le 2026-07-11 — voir Settings → Source
  # du service "ideal-learning" sur le dashboard Railway). L'ancien job CI ici ciblait
  # un service "backend" inexistant (le vrai nom est "ideal-learning") et masquait son
  # propre échec via `continue-on-error: true` — un second chemin de déploiement, en
  # plus d'être cassé, aurait aussi risqué de créer des déploiements concurrents à
  # chaque push.
