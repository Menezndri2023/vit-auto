name: VIT AUTO — Publication iOS (TestFlight / App Store)

# Compile, signe et ENVOIE l'app à App Store Connect depuis le runner macOS de
# GitHub : aucune installation locale (Xcode, certificat, profil) n'est requise.
#
# Signature MANUELLE avec un vrai certificat de distribution et un profil App
# Store, fournis en secrets — la méthode classique, déterministe. La signature
# « cloud » (certificat géré par Apple via la clé d'API) a été essayée le
# 2026-09-15 : Xcode la refuse à l'archivage en ligne de commande, et une
# archive non signée est rejetée à l'envoi (erreur 90035). La clé d'API reste
# nécessaire pour l'ENVOI vers App Store Connect.
#
# Secrets GitHub (les trois de signature sont préparés par
# docs/manuels/publication-app-store.md, section « Certificat ») :
#   APPLE_TEAM_ID                  Team ID (10 caractères), page Membership
#   APP_STORE_CONNECT_KEY_ID       identifiant de la clé d'API
#   APP_STORE_CONNECT_ISSUER_ID    Issuer ID affiché au-dessus des clés
#   APP_STORE_CONNECT_PRIVATE_KEY  contenu du fichier AuthKey_XXXX.p8
#   APPLE_CERTIFICATE_P12          certificat Apple Distribution + clé privée, .p12 en base64
#   APPLE_CERTIFICATE_PASSWORD     mot de passe du .p12
#   APPLE_PROVISIONING_PROFILE     profil « App Store Connect » du bundle, .mobileprovision en base64
#
# Le numéro de build (CURRENT_PROJECT_VERSION) est le numéro d'exécution du
# workflow : strictement croissant, donc jamais refusé par App Store Connect
# pour doublon. La version affichée (MARKETING_VERSION) est saisie au lancement.

on:
  workflow_dispatch:
    inputs:
      version:
        # Apple FERME définitivement un numéro de version dès qu'il est
        # approuvé : le réutiliser fait échouer l'envoi après l'archivage
        # (erreurs 90186 « train closed » et 90062 « must contain a higher
        # version »). La valeur par défaut « 1.0.0 » est restée en place après
        # la publication de la 1.0 et a fait échouer le run #10 du 2026-09-24 :
        # elle doit toujours désigner la PROCHAINE version, jamais la dernière.
        description: "Version App Store — STRICTEMENT supérieure à la dernière publiée, et identique à celle créée dans App Store Connect (ex. 1.1)"
        required: true
        default: "1.1"

env:
  NODE_VERSION: "22"
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
  APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
  APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
  APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}

jobs:
  publier:
    name: iOS — Archive signée + envoi App Store Connect
    runs-on: macos-latest
    steps:
      - name: Vérifier la présence des secrets Apple
        run: |
          manquants=""
          for v in APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE; do
            if [ -z "${!v}" ]; then manquants="$manquants $v"; fi
          done
          if [ -n "$manquants" ]; then
            echo "::error::Secrets GitHub manquants :$manquants. Ils ne peuvent être créés qu'avec un compte Apple Developer ACTIF — voir docs/manuels/publication-app-store.md"
            exit 1
          fi
          echo "Secrets présents. Team ID : ${APPLE_TEAM_ID:0:2}******** ; clé API : ${APP_STORE_CONNECT_KEY_ID}"

      - uses: actions/checkout@v4
      - name: Refuser une version déjà publiée
        # Coûte une seconde et une requête publique (aucun secret) ; sans elle,
        # l'erreur n'apparaît qu'après l'archivage et la signature, soit ~90 s
        # plus tard, dans un journal où elle se remarque à peine.
        # L'API publique retarde de quelques heures après une mise en vente :
        # cette garde attrape le cas courant — resaisir la version en ligne —
        # sans prétendre remplacer la vérification d'Apple à l'envoi.
        run: |
          saisie="${{ inputs.version }}"
          enligne=$(curl -sf --max-time 20 "https://itunes.apple.com/lookup?id=6812376006" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).results?.[0]?.version||'')}catch{console.log('')}})")
          echo "Version saisie : $saisie — version en vente sur l'App Store : ${enligne:-inconnue}"
          if [ -n "$enligne" ] && [ "$saisie" = "$enligne" ]; then
            echo "::error::La version $saisie est DÉJÀ publiée : Apple a fermé ce numéro et refusera l'envoi (erreur 90186). Relancez avec un numéro supérieur, identique à la version préparée dans App Store Connect."
            exit 1
          fi


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web (dist/)
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Installer la clé d'API App Store Connect
        # Le secret est accepté sous deux formes : le fichier .p8 complet
        # (avec ses lignes BEGIN/END), ou seulement son corps base64 — c'est
        # ce qu'on obtient en copiant depuis certains éditeurs. Espaces, lignes
        # vides et retours Windows sont nettoyés : la première tentative réelle
        # a échoué sur un en-tête absent, pas sur une clé fausse.
        run: |
          mkdir -p "$HOME/private_keys"
          FICHIER="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          CORPS=$(printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | tr -d '\r' | grep -v "PRIVATE KEY" | tr -d ' \t\n')
          if [ -z "$CORPS" ]; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY est vide après nettoyage — recollez le contenu du fichier AuthKey_XXXX.p8."
            exit 1
          fi
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s' "$CORPS" | fold -w 64
            echo
            echo "-----END PRIVATE KEY-----"
          } > "$FICHIER"
          chmod 600 "$FICHIER"
          # Une clé .p8 d'App Store Connect fait ~200 caractères base64 ; en
          # dessous, ce n'est pas une clé (souvent le Key ID collé par erreur).
          if [ "${#CORPS}" -lt 150 ]; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY est trop court (${#CORPS} caractères) : ce n'est pas le contenu du fichier .p8 — vérifiez que vous n'avez pas collé le Key ID à la place."
            exit 1
          fi
          echo "Clé installée (${#CORPS} caractères base64)."

      - name: Installer le certificat de distribution et le profil
        # Trousseau TEMPORAIRE dédié au job : le certificat n'y survit pas au
        # runner, et il ne dépend pas du trousseau de connexion (dont le mot de
        # passe est inconnu en CI). L'intermédiaire Apple WWDR G3 est importé
        # aussi : sans lui, la chaîne de confiance est incomplète et codesign
        # refuse l'identité même si le certificat est valide.
        run: |
          set -e
          TROUSSEAU="$RUNNER_TEMP/signature.keychain-db"
          MDP_TROUSSEAU="$(openssl rand -hex 16)"
          security create-keychain -p "$MDP_TROUSSEAU" "$TROUSSEAU"
          security set-keychain-settings -lut 21600 "$TROUSSEAU"
          security unlock-keychain -p "$MDP_TROUSSEAU" "$TROUSSEAU"
          security list-keychains -d user -s "$TROUSSEAU" $(security list-keychains -d user | tr -d '"')

          curl -sSf -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$TROUSSEAU" -T /usr/bin/codesign -T /usr/bin/security >/dev/null

          printf '%s' "$APPLE_CERTIFICATE_P12" | tr -d ' \n\r' | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$TROUSSEAU" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          # Autorise codesign à utiliser la clé sans boîte de dialogue (il n'y a
          # personne pour cliquer sur un runner).
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MDP_TROUSSEAU" "$TROUSSEAU" >/dev/null

          IDENTITES=$(security find-identity -v -p codesigning "$TROUSSEAU")
          echo "$IDENTITES"
          echo "$IDENTITES" | grep -q "Apple Distribution" \
            || { echo "::error::Aucune identité « Apple Distribution » valide dans le .p12 — vérifiez APPLE_CERTIFICATE_P12 et APPLE_CERTIFICATE_PASSWORD."; exit 1; }

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$APPLE_PROVISIONING_PROFILE" | tr -d ' \n\r' | base64 --decode > "$RUNNER_TEMP/profil.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profil.mobileprovision" | plutil -extract UUID raw -o - -)
          NOM=$(security cms -D -i "$RUNNER_TEMP/profil.mobileprovision" | plutil -extract Name raw -o - -)
          APPID=$(security cms -D -i "$RUNNER_TEMP/profil.mobileprovision" | plutil -extract Entitlements.application-identifier raw -o - -)
          cp "$RUNNER_TEMP/profil.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Profil « $NOM » ($UUID) pour $APPID"
          case "$APPID" in *.com.vitauto.app) ;; *) echo "::error::Le profil ne couvre pas com.vitauto.app (il couvre $APPID)."; exit 1;; esac
          echo "PROFIL_NOM=$NOM" >> "$GITHUB_ENV"
          echo "PROFIL_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Archiver (Release, signature manuelle)
        # La signature (identité, équipe, profil « VIT AUTO App Store ») est
        # fixée sur la CIBLE App, configuration Release, dans le projet Xcode —
        # pas en ligne de commande : un réglage passé à xcodebuild s'applique à
        # toutes les cibles, et les bibliothèques Swift Package (IONCameraLib…)
        # refusent un profil (« does not support provisioning profiles »).
        working-directory: ios/App
        run: |
          # Le profil installé doit être celui que le projet nomme.
          [ "$PROFIL_NOM" = "VIT AUTO App Store" ] || { echo "::error::Le profil fourni s'appelle « $PROFIL_NOM » ; le projet attend « VIT AUTO App Store » (PROVISIONING_PROFILE_SPECIFIER de la cible App)."; exit 1; }
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -skipPackagePluginValidation \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log" | tail -150
          # Vérification AVANT l'envoi : l'archive doit être signée en distribution,
          # sinon Apple la refusera après plusieurs minutes d'upload (erreur 90035).
          codesign -dvv "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" 2>&1 | grep -E "Authority=Apple Distribution|TeamIdentifier" \
            || { echo "::error::L'archive n'est pas signée avec le certificat Apple Distribution."; exit 1; }

      - name: Exporter et envoyer vers App Store Connect (TestFlight)
        working-directory: ios/App
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>com.vitauto.app</key><string>${PROFIL_NOM}</string></dict>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" | tail -300
          echo "Build ${{ github.run_number }} (version ${{ inputs.version }}) envoyé. Il apparaît dans App Store Connect → TestFlight après le traitement Apple (10 à 30 min)."

      - name: Conserver les journaux d'export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-export-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/export
            ${{ runner.temp }}/archive.log
          if-no-files-found: ignore
