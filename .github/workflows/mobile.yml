name: VIT AUTO — Mobile Build (Android/iOS)

# Débloque les builds natifs sans rien installer localement (ni Xcode complet,
# ni Android Studio, ni même Java ne sont disponibles sur la machine de dev —
# voir ARCHITECTURE.md). Les runners GitHub hébergés ont déjà tout le nécessaire.
#
# Limite assumée : sans compte Apple Developer ni keystore de release Android,
# on ne peut produire que des builds NON destinés à la distribution publique :
#   - Android : APK "debug", auto-signé par la keystore de debug par défaut de
#     Gradle — installable directement sur un appareil/émulateur (`adb install`),
#     mais pas publiable sur le Play Store en l'état.
#   - iOS : build SIMULATEUR uniquement (aucune signature de code requise) —
#     valide que le projet compile, mais ne produit pas d'.ipa installable sur
#     un vrai iPhone ni publiable sur l'App Store.
# Passer à des builds signés/publiables nécessitera : un compte Apple Developer
# Program (99 $/an) + certificat de distribution + provisioning profile, et une
# vraie keystore de release Android (signingConfigs dans android/app/build.gradle,
# absent aujourd'hui).

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "android/**"
      - "ios/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  android:
    name: Android — Build APK debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Setup Java (requis par Gradle/Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Build web (dist/)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build APK debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vit-auto-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    name: iOS — Build (simulateur)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web (dist/)
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Build for iOS Simulator (sans signature)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
