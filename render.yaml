services:
  - type: web
    name: vit-auto-api
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: server
    plan: free
    # Bug réel corrigé (audit résilience) : /api/ping répond toujours 200 sans
    # jamais vérifier Mongo — si la base se déconnecte en prod (cluster en
    # pause, IP whitelist expirée...), Render croyait le service en bonne
    # santé indéfiniment, ne le redémarrait jamais. /api/health renvoie 503
    # dès que mongoose.connection.readyState n'est pas "connected".
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_CHANNEL
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
